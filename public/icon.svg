<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#818CF8" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#6366F1" stroke-width="3" stroke-opacity="0.4"/>
  
  <!-- Graduation Cap & Hub Graphic -->
  <g transform="translate(256, 240)" filter="url(#glow)">
    <!-- Mortarboard Cap Diamond Top -->
    <polygon points="0,-100 170,-30 0,40 -170,-30" fill="url(#accentGrad)"/>
    
    <!-- Skullcap Base -->
    <path d="M -90,0 L -90,45 C -90,85 90,85 90,45 L 90,0 Z" fill="#4F46E5" opacity="0.95"/>
    
    <!-- Tassel and Ribbon -->
    <path d="M 0,-40 C 60,-40 120,-10 145,30 L 140,85" fill="none" stroke="#FDE047" stroke-width="7" stroke-linecap="round"/>
    <circle cx="140" cy="95" r="9" fill="#FACC15"/>
    <circle cx="0" cy="-35" r="8" fill="#FDE047"/>

    <!-- Central Student Hub Star/Sparkle -->
    <g transform="translate(0, 140)">
      <circle cx="0" cy="0" r="28" fill="url(#accentGrad)"/>
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="#FFFFFF"/>
    </g>
  </g>
  
  <!-- Brand Ring Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#A855F7" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="12 12"/>
</svg>
